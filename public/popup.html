<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Drive Semantic Search</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        width: 380px;
        margin: 0;
        padding: 12px;
        font-family: system-ui, sans-serif;
        font-size: 14px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 15px;
      }
      #query {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 9px;
        font-size: 14px;
      }
      #status {
        margin: 8px 0;
        font-size: 12px;
        opacity: 0.7;
      }
      button {
        margin-top: 4px;
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
      }
      #index-panel {
        margin: 4px 0 8px;
      }
      #index-bar {
        width: 100%;
        height: 8px;
        display: block;
        margin-top: 6px;
      }
      #index-progress {
        margin-top: 4px;
      }
      #results {
        margin-top: 8px;
      }
      .result {
        padding: 8px 6px;
        border-top: 1px solid rgba(128, 128, 128, 0.25);
        cursor: pointer;
      }
      .result:hover {
        background: rgba(128, 128, 128, 0.12);
      }
      .result-title {
        font-weight: 600;
      }
      .result-crumb {
        font-size: 11px;
        opacity: 0.6;
      }
      .result-snippet {
        margin-top: 2px;
        font-size: 12px;
        opacity: 0.85;
      }
      .hint {
        font-size: 12px;
        opacity: 0.6;
      }
      details {
        margin-top: 12px;
        font-size: 12px;
      }
      #dev-result {
        margin-top: 8px;
        font-size: 12px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <h1>Drive Semantic Search</h1>
    <input id="query" type="search" placeholder="Search your Docs…" autofocus />
    <p id="status">Checking Google Drive connection…</p>
    <button id="connect" hidden>Connect Google Drive</button>

    <div id="index-panel" hidden>
      <button id="index-action"></button>
      <button id="sync-now">Sync now</button>
      <progress id="index-bar" max="100" value="0" hidden></progress>
      <div id="index-progress" class="hint" hidden></div>
      <div id="sync-result" class="hint" hidden></div>
    </div>

    <div id="results"></div>

    <details>
      <summary>Dev tools</summary>
      <button id="list-docs" hidden>List Docs</button>
      <button id="export-all" hidden>Export All</button>
      <button id="embed-test">Test Embed</button>
      <button id="embed-bench">Bench Batching</button>
      <p id="dev-result" hidden></p>
    </details>

    <script type="module" src="popup.js"></script>
  </body>
</html>
